<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Volleyball Rotation Tool</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="top-bar">
    <div>
        <h1>🏐 Volleyball Rotation Tool</h1>
        <p>5–1 / 6–2 Rotation & Match Scoring</p>
    </div>

    <div class="version">
        v1.7
    </div>
</header>


<main>

    <!-- ============================= -->
    <!-- HOME -->
    <!-- ============================= -->

    <section id="homeScreen" class="screen">

        <div class="menu-card">

            <h2>Volleyball Tool</h2>

            <button
                class="menu-button"
                onclick="openRotationSetup()"
            >
                🔄 Rotation Guide
            </button>

            <button
                class="menu-button"
                onclick="openPlayerSetup()"
            >
                👥 Player Setup
            </button>

            <button
                class="menu-button"
                onclick="openScorekeeper()"
            >
                🏆 Score Keeper
            </button>

        </div>

    </section>


    <!-- ============================= -->
    <!-- SYSTEM SELECTION -->
    <!-- ============================= -->

    <section
        id="systemScreen"
        class="screen hidden"
    >

        <div class="setup-card">

            <h2>Select Offensive System</h2>

            <p>
                Choose the system your team is using.
            </p>

            <div class="system-buttons">

                <button onclick="chooseSystem(5)">
                    5–1
                </button>

                <button onclick="chooseSystem(6)">
                    6–2
                </button>

            </div>

            <button
                class="back-button"
                onclick="goHome()"
            >
                ← Back
            </button>

        </div>

    </section>


    <!-- ============================= -->
    <!-- ROTATION SETUP -->
    <!-- ============================= -->

    <section
        id="rotationSetupScreen"
        class="screen hidden"
    >

        <div class="setup-card">

            <h2>Rotation Setup</h2>

            <p id="selectedSystemText"></p>

            <label>
                Will you be using a libero?
            </label>

            <div class="libero-choice">

                <button
                    onclick="setLiberoUsage(true)"
                    id="liberoYesButton"
                >
                    Yes
                </button>

                <button
                    onclick="setLiberoUsage(false)"
                    id="liberoNoButton"
                >
                    No
                </button>

            </div>

            <label for="setterPosition">
                Starting setter position
            </label>

            <select id="setterPosition">

                <option value="1">
                    Position 1
                </option>

                <option value="2">
                    Position 2
                </option>

                <option value="3">
                    Position 3
                </option>

                <option value="4">
                    Position 4
                </option>

                <option value="5">
                    Position 5
                </option>

                <option value="6">
                    Position 6
                </option>

            </select>

            <button
                class="main-button"
                onclick="startRotation()"
            >
                Start Rotation
            </button>

            <button
                class="back-button"
                onclick="goHome()"
            >
                ← Back
            </button>

        </div>

    </section>


    <!-- ============================= -->
    <!-- PLAYER SETUP -->
    <!-- ============================= -->

    <section
        id="playerSetupScreen"
        class="screen hidden"
    >

        <div class="setup-card">

            <h2>Player Setup</h2>

            <p id="playerSystemText"></p>

            <div id="playerInputs"></div>

            <div
                id="liberoInputContainer"
                class="libero-input"
            >
            </div>

            <button
                class="main-button"
                onclick="savePlayers()"
            >
                Save Players
            </button>

            <button
                class="back-button"
                onclick="goHome()"
            >
                ← Back
            </button>

        </div>

    </section>


    <!-- ============================= -->
    <!-- ROTATION COURT -->
    <!-- ============================= -->

    <section
        id="rotationScreen"
        class="screen hidden"
    >

        <div class="rotation-header">

            <div>
                <h2 id="rotationSystemTitle">
                    5–1 Rotation
                </h2>

                <span id="rotationCounter">
                    Rotation 1
                </span>
            </div>

            <div class="rotation-actions">

                <button onclick="previousRotation()">
                    ←
                </button>

                <button onclick="nextRotation()">
                    Rotate →
                </button>

            </div>

        </div>


        <div class="volleyball-court">

            <div class="court-surface"></div>
            <div class="attack-line"></div>
            <div class="attack-extension attack-extension-left"></div>
            <div class="attack-extension attack-extension-right"></div>
            <div class="service-marker service-marker-left"></div>
            <div class="service-marker service-marker-right"></div>
            <div class="net"></div>

            <div
                id="courtPos4"
                class="court-player pos4"
            ></div>

            <div
                id="courtPos3"
                class="court-player pos3"
            ></div>

            <div
                id="courtPos2"
                class="court-player pos2"
            ></div>

            <div
                id="courtPos5"
                class="court-player pos5"
            ></div>

            <div
                id="courtPos6"
                class="court-player pos6"
            ></div>

            <div
                id="courtPos1"
                class="court-player pos1"
            ></div>

        </div>


        <div class="court-controls">

            <button onclick="toggleServeReceive()">
                Serve Receive
            </button>

            <button onclick="toggleMovement()">
                Show Movement
            </button>

            <button
                class="back-button"
                onclick="goHome()"
            >
                ← Home
            </button>

        </div>


        <div
            id="animationInfo"
            class="animation-info hidden"
        >
            <p id="animationText"></p>
        </div>

    </section>


    <!-- ============================= -->
    <!-- SCORE KEEPER -->
    <!-- ============================= -->

    <section
        id="scoreScreen"
        class="screen score-screen hidden"
    >

        <div class="score-header">

            <div>

                <input
                    id="teamAName"
                    value="Team A"
                    class="team-name-input"
                >

            </div>


            <div class="match-information">

                <div>
                    Set
                    <span id="currentSet">1</span>
                </div>

                <div>
                    Sets
                    <span id="setsScore">0 - 0</span>
                </div>

                <div>
                    Serving:
                    <span id="servingTeam">
                        Team A
                    </span>
                </div>

            </div>


            <div>

                <input
                    id="teamBName"
                    value="Team B"
                    class="team-name-input"
                >

            </div>

        </div>


        <!-- ============================= -->
        <!-- SCORE BUTTONS -->
        <!-- ============================= -->

        <div class="score-buttons">

            <div class="team-score-controls">

                <!--
                    The button text is now the
                    team's CURRENT SCORE.

                    Clicking it adds one point.
                -->

                <button
                    id="teamAScoreButton"
                    class="point-button team-a"
                    onclick="addPoint('A')"
                >
                    0
                </button>

                <button
                    class="minus-button"
                    onclick="removePoint('A')"
                >
                    −1
                </button>

            </div>


            <div class="team-score-controls">

                <button
                    id="teamBScoreButton"
                    class="point-button team-b"
                    onclick="addPoint('B')"
                >
                    0
                </button>

                <button
                    class="minus-button"
                    onclick="removePoint('B')"
                >
                    −1
                </button>

            </div>

        </div>


        <div
            id="setMessage"
            class="set-message"
        >
        </div>


        <div class="score-options">

            <button onclick="resetSet()">
                Reset Set
            </button>

            <button onclick="resetMatch()">
                Reset Match
            </button>

            <button
                class="back-button"
                onclick="goHome()"
            >
                ← Home
            </button>

        </div>

    </section>

</main>


<footer>

    <span>
        Volleyball Rotation Tool
    </span>

    <span>
        Version 1.7
    </span>

</footer>


<script src="script.js"></script>

</body>
</html>
